name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # A successful single-worker browser suite already takes about 20 minutes
    # on the shared runner. Leave enough headroom for Playwright's deliberate
    # retries without cancelling the deployment gate mid-test.
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workbench
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench
      DATABASE_POOL_MAX: 5
      DATABASE_SSL: "false"
      SESSION_SECRET: ci-session-secret-that-is-at-least-thirty-two-bytes
      WEB_ORIGIN: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run all quality gates
        run: pnpm check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: pnpm test:e2e

      # A failed browser assertion should be diagnosable without weakening the
      # deployment gate.  These files contain only CI fixtures, are retained
      # briefly, and are uploaded only when the test step has already failed.
      - name: Retain Playwright failure evidence
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7
