name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workbench
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench
      DATABASE_POOL_MAX: 5
      DATABASE_SSL: "false"
      SESSION_SECRET: ci-session-secret-that-is-at-least-thirty-two-bytes
      WEB_ORIGIN: http://localhost:5173
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Run all quality gates
        run: pnpm check

      - name: Share the verified production build
        uses: actions/upload-artifact@v4
        with:
          name: production-build
          path: |
            apps/web/dist
            apps/server/dist
            apps/worker/dist
            packages/shared/dist
            packages/db/dist
            packages/ui/dist
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  browser:
    name: browser (${{ matrix.suite }})
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Keep this image aligned with @playwright/test in package.json. It includes
    # the browsers and OS libraries, avoiding slow apt mirror downloads per run.
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
      options: --ipc=host --init
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: e2e-1
            command: pnpm exec playwright test --shard=1/3
          - suite: e2e-2
            command: pnpm exec playwright test --shard=2/3
          - suite: e2e-3
            command: pnpm exec playwright test --shard=3/3
          - suite: live
            command: pnpm exec playwright test -c playwright.live.config.ts
          - suite: wide
            command: pnpm exec playwright test -c playwright.wide.config.ts
          - suite: engines
            command: pnpm exec playwright test -c playwright.engines.config.ts
          - suite: upgrades
            command: pnpm exec playwright test -c playwright.upgrades.config.ts
          - suite: payroll
            command: pnpm exec playwright test -c playwright.money.config.ts
    env:
      NODE_ENV: test
      PLAYWRIGHT_PREVIEW: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the verified production build
        uses: actions/download-artifact@v4
        with:
          name: production-build
          path: .

      # Each matrix entry has its own process and database. Keep one browser
      # worker per runner to avoid CPU contention and preserve auth rate limits.
      - name: Run browser acceptance
        run: |
          # GitHub mounts this directory as pwuser-owned while the official
          # image runs as root. Firefox requires its home to match its user.
          chown "$(id -u):$(id -g)" "$HOME"
          ${{ matrix.command }}

      - name: Retain acceptance evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: acceptance-${{ matrix.suite }}-${{ github.run_id }}
          path: test-results
          if-no-files-found: ignore
          retention-days: 7

  # A stable required check gates both automatic merging and Render deployment.
  # It must fail when any prerequisite fails or is skipped, never report green
  # just because a dependent browser job could not start.
  verify:
    if: ${{ always() }}
    needs: [quality, browser]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every quality and browser check
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$BROWSER_RESULT" = success
