name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: workbench
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U workbench -d workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://workbench:workbench@127.0.0.1:5432/workbench
      DATABASE_POOL_MAX: 5
      DATABASE_SSL: "false"
      SESSION_SECRET: ci-session-secret-that-is-at-least-thirty-two-bytes
      WEB_ORIGIN: http://localhost:5173
      SEED_OWNER_PASSWORD: CI-Only-Seed-Password-123!
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply database migrations
        run: pnpm db:migrate

      - name: Seed test database
        run: pnpm db:seed

      - name: Run all quality gates
        run: pnpm check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser end-to-end tests
        run: pnpm test:e2e
