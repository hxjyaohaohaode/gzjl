name: Auto merge verified changes

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency:
  group: auto-merge-main
  cancel-in-progress: false

jobs:
  merge:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # This privileged workflow never checks out or executes PR code. Only the
      # repository owner's non-draft, same-repository PRs targeting main qualify.
      - name: Merge the exact verified revision and start main checks
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            const pulls = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', base: 'main',
              head: `${owner}:${run.head_branch}`,
            });
            for (const pull of pulls) {
              if (pull.draft || pull.user.login !== owner ||
                  pull.head.repo?.full_name !== `${owner}/${repo}` ||
                  pull.head.sha !== run.head_sha) continue;
              // GitHub also enforces main's required verify check and current
              // base revision; never use an administrator bypass here.
              const result = await github.rest.pulls.merge({
                owner, repo, pull_number: pull.number,
                sha: run.head_sha, merge_method: 'merge',
              });
              if (!result.data.merged) {
                core.setFailed(result.data.message);
                return;
              }
              // GITHUB_TOKEN merges do not trigger push workflows. Dispatch
              // explicitly so Render's checksPass gate sees CI on main.
              await github.rest.actions.createWorkflowDispatch({
                owner, repo, workflow_id: 'ci.yml', ref: 'main',
              });
              core.notice(`Merged PR #${pull.number}; main CI and automatic deployment are queued.`);
            }
