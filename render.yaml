databases:
  - name: gzjl-hxjyaohaohaode-postgres
    databaseName: workbench
    user: workbench
    plan: 0.1c-256mb
    region: singapore

services:
  - type: web
    name: gzjl-hxjyaohaohaode-web
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @workbench/server start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: PNPM_VERSION
        value: 11.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      # pnpm runs this package's start script from apps/server. The built PWA
      # is its sibling at apps/web/dist, so this must be package-relative.
      - key: WEB_DIST_DIR
        value: ../web/dist
      - key: DATABASE_URL
        fromDatabase:
          name: gzjl-hxjyaohaohaode-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: AI_ENABLED
        value: "true"
      # Render creates this once. The Worker below receives the same value over
      # Render's private service reference, so no human has to copy a secret.
      - key: AI_CONFIG_ENCRYPTION_KEY
        generateValue: true
      # Push endpoint/auth material is encrypted before it enters PostgreSQL.
      # Worker receives this same generated value through a private reference.
      - key: PUSH_SUBSCRIPTION_ENCRYPTION_KEY
        generateValue: true
      - key: AI_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      # Self-reference Render's auto-assigned public HTTPS URL. This keeps the
      # initial Blueprint creation free of manual domain fields.
      - key: WEB_ORIGIN
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_APP_URL
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Optional integrations deliberately have no sync:false placeholder.
      # A first deployment therefore needs no third-party credentials. Add
      # these values later in Render > Web service > Environment when the
      # organization is ready to enable file uploads, automatic email/SMS, or
      # fallback AI. The default member invitation path uses an Owner/manager
      # copied one-time link and therefore works without mail/SMS; automatic
      # delivery always reports an unconfigured integration explicitly.
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        # Cloudflare R2 is the documented zero-server setup. Path-style URLs
        # keep the SDK signing endpoint and browser upload origin identical,
        # which removes one easy-to-miss bucket-subdomain calculation.
        value: "true"
      # File attachments are a core production capability. On a new Blueprint,
      # Render asks for these private object-storage values instead of putting
      # placeholders or secrets in Git. For an existing service, add the same
      # keys under Web service > Environment, then redeploy.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BROWSER_ORIGIN
        sync: false
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # The object store remains optional until its own private bucket
      # credentials are supplied. When it is configured, evidence supports an
      # arbitrary number of files; this is only the per-file safety ceiling.
      - key: ATTACHMENT_MAX_BYTES
        value: "104857600"
      - key: SIGNED_URL_TTL_SECONDS
        value: "900"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMS_PROVIDER
        value: disabled
      # The API only exposes the public application-server key to authenticated
      # browsers. Existing Blueprints ignore newly added sync:false entries, so
      # an omitted key safely keeps Push disabled until it is added manually.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: ZHIPU_API_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: ZHIPU_MODEL
        value: glm-4.7-flash

  - type: worker
    name: gzjl-hxjyaohaohaode-worker
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @workbench/worker start
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: PNPM_VERSION
        value: 11.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gzjl-hxjyaohaohaode-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: AI_ENABLED
        value: "true"
      # Read the generated API/Web value directly. Do not replace this with a
      # manually typed secret, otherwise saved organization AI credentials
      # cannot be decrypted consistently by the Worker.
      - key: AI_CONFIG_ENCRYPTION_KEY
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: AI_CONFIG_ENCRYPTION_KEY
      - key: PUSH_SUBSCRIPTION_ENCRYPTION_KEY
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: PUSH_SUBSCRIPTION_ENCRYPTION_KEY
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Evidence uploads are signed by the Web service while background export
      # artifacts are written and expired by the Worker. Both services must
      # therefore address the same private bucket with the same credentials.
      - key: S3_REGION
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: S3_REGION
      - key: S3_FORCE_PATH_STYLE
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: S3_FORCE_PATH_STYLE
      - key: S3_ENDPOINT
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: S3_ENDPOINT
      - key: S3_BUCKET
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: S3_BUCKET
      - key: S3_ACCESS_KEY_ID
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: S3_ACCESS_KEY_ID
      - key: S3_SECRET_ACCESS_KEY
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: S3_SECRET_ACCESS_KEY
      - key: AI_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: ZHIPU_API_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: ZHIPU_MODEL
        value: glm-4.7-flash
