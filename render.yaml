databases:
  - name: gzjl-hxjyaohaohaode-postgres
    databaseName: workbench
    user: workbench
    plan: 0.1c-256mb
    region: singapore

services:
  - type: web
    name: gzjl-hxjyaohaohaode-web
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm db:migrate
    startCommand: pnpm --filter @workbench/server start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: PNPM_VERSION
        value: 11.19.0
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: gzjl-hxjyaohaohaode-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: AI_ENABLED
        value: "true"
      # Render creates this once. The Worker below receives the same value over
      # Render's private service reference, so no human has to copy a secret.
      - key: AI_CONFIG_ENCRYPTION_KEY
        generateValue: true
      - key: AI_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: DATABASE_POOL_MAX
        value: "10"
      - key: SESSION_SECRET
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      # Self-reference Render's auto-assigned public HTTPS URL. This keeps the
      # initial Blueprint creation free of manual domain fields.
      - key: WEB_ORIGIN
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      - key: PUBLIC_APP_URL
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: RENDER_EXTERNAL_URL
      # Optional integrations deliberately have no sync:false placeholder.
      # A first deployment therefore needs no third-party credentials. Add
      # these values later in Render > Web service > Environment when the
      # organization is ready to enable file uploads, email, SMS, or fallback
      # AI. The application reports an unconfigured integration explicitly;
      # it never pretends a file, message, or AI answer was delivered.
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_SECURE
        value: "false"
      - key: SMS_PROVIDER
        value: disabled
      - key: ZHIPU_API_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: ZHIPU_MODEL
        value: glm-4.7-flash

  - type: worker
    name: gzjl-hxjyaohaohaode-worker
    runtime: node
    plan: 0.5c-512mb
    region: singapore
    branch: main
    autoDeployTrigger: checksPass
    buildCommand: pnpm install --frozen-lockfile && pnpm build
    startCommand: pnpm --filter @workbench/worker start
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: PNPM_VERSION
        value: 11.19.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gzjl-hxjyaohaohaode-postgres
          property: connectionString
      - key: DATABASE_SSL
        value: "false"
      - key: DATABASE_POOL_MAX
        value: "5"
      - key: AI_ENABLED
        value: "true"
      # Read the generated API/Web value directly. Do not replace this with a
      # manually typed secret, otherwise saved organization AI credentials
      # cannot be decrypted consistently by the Worker.
      - key: AI_CONFIG_ENCRYPTION_KEY
        fromService:
          name: gzjl-hxjyaohaohaode-web
          type: web
          envVarKey: AI_CONFIG_ENCRYPTION_KEY
      - key: AI_REQUEST_TIMEOUT_MS
        value: "60000"
      - key: AI_MAX_RETRIES
        value: "2"
      - key: ZHIPU_API_BASE_URL
        value: https://open.bigmodel.cn/api/paas/v4
      - key: ZHIPU_MODEL
        value: glm-4.7-flash
